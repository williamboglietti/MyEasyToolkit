[package]
name = "myeasytoolkit"
version = "0.1.5"
edition = "2021"
description = "Browse and run scripts from HTTP repositories"

[dependencies]
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "underline-color", "layout-cache"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
scraper = "0.23"
serde_json = "1"
tempfile = "3"
url = "2"
unicode-width = "0.2"
portable-pty = "0.8"
vt100 = "0.15"

[profile.release]
strip = true
lto = true
