[package]
name = "myeasytoolkit"
version = "0.1.0"
edition = "2021"
description = "Browse and run scripts from HTTP repositories"

[dependencies]
crossterm = "0.28"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
scraper = "0.23"
serde_json = "1"
tempfile = "3"
url = "2"
unicode-width = "0.2"

[profile.release]
strip = true
lto = true
