name: Publish validated release
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  validate:
    runs-on: ubuntu-22.04
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Require successful CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          count="$(gh api "repos/$REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$REVISION&event=push&status=success" --jq '.total_count')"
          [[ "$count" -gt 0 ]] || { echo 'Aucune CI verte sur ce commit de main.' >&2; exit 1; }
  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, platform: linux, arch: amd64, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, platform: linux, arch: arm64, target: aarch64-unknown-linux-musl }
          - { os: macos-15-intel, platform: darwin, arch: amd64, target: x86_64-apple-darwin }
          - { os: macos-15, platform: darwin, arch: arm64, target: aarch64-apple-darwin }
          - { os: windows-latest, platform: windows, arch: amd64, target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, platform: windows, arch: arm64, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build tools
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Add target
        run: rustup target add ${{ matrix.target }}
      - name: Run tests on target
        run: cargo test --locked --target ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package Unix binary
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          mkdir -p dist
          tar -czf "dist/myeasytoolkit-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz" -C "target/${{ matrix.target }}/release" myeasytoolkit
      - name: Package Debian binary
        if: matrix.platform == 'linux'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: bash packaging/build-deb.sh
      - name: Package Windows binary
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/myeasytoolkit.exe" "dist/myeasytoolkit-windows-${{ matrix.arch }}.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: true
      - name: Install repository tools
        run: sudo apt-get update && sudo apt-get install -y apt-utils
      - name: Create signed distribution
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          SIGNING_PASSPHRASE: ${{ secrets.APT_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          [[ -n "$SIGNING_KEY" && -n "$SIGNING_PASSPHRASE" ]] || { echo 'Secrets de signature absents.' >&2; exit 1; }
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          chmod 700 "$GNUPGHOME"
          trap 'gpgconf --kill gpg-agent || true; rm -rf "$GNUPGHOME"' EXIT
          printf '%s' "$SIGNING_KEY" | gpg --batch --import
          printf '%s' "$SIGNING_PASSPHRASE" > "$GNUPGHOME/passphrase"
          chmod 600 "$GNUPGHOME/passphrase"
          export MET_GPG_PASSPHRASE_FILE="$GNUPGHOME/passphrase"
          fingerprint="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')"
          expected="$(tr -d '\r\n' < packaging/archive-fingerprint.txt)"
          [[ "$fingerprint" == "$expected" ]] || { echo 'La clé de signature ne correspond pas à la clé de confiance.' >&2; exit 1; }
          bash packaging/stage-release.sh release-artifacts distribution "$fingerprint"
          cmp packaging/myeasytoolkit-archive-keyring.gpg distribution/apt/myeasytoolkit-archive-keyring.gpg
          tar -C distribution -czf distribution.tar.gz apt releases install.sh install.ps1 _headers
          gpg --batch --yes --pinentry-mode loopback --passphrase-file "$MET_GPG_PASSPHRASE_FILE" --local-user "$fingerprint" --detach-sign --output distribution.tar.gz.sig distribution.tar.gz
      - name: Publish signed bundle to GitHub
        id: bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="build-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" distribution.tar.gz distribution.tar.gz.sig \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Distribution ${GITHUB_SHA:0:12}" --notes "Signed distribution bundle for site deployment."
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
      - name: Trigger site deployment
        env:
          GH_TOKEN: ${{ secrets.SITE_DEPLOY_TOKEN }}
          RELEASE_TAG: ${{ steps.bundle.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$GH_TOKEN" ]] || { echo 'Secret SITE_DEPLOY_TOKEN absent.' >&2; exit 1; }
          jq -n --arg tag "$RELEASE_TAG" '{ref:"main",inputs:{release_tag:$tag}}' | \
            gh api --method POST repos/williamboglietti/MyEasyToolkit.com/actions/workflows/deploy.yml/dispatches --input -
